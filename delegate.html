<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#f5f7f4"><title>التفويض</title><style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#17251d;--muted:#78857d;--line:#e3e9e4;--accent:#1f6b4f;--soft:#eaf4ef;--danger:#9b3838}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;color:var(--ink)}main{max-width:520px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.logo{text-align:center;font-size:28px;margin:8px}.title{text-align:center;font-size:22px;font-weight:900;margin-bottom:4px}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 34px rgba(31,65,46,.07)}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input{width:100%;height:58px;border:1px solid var(--line);border-radius:16px;text-align:center;font-size:24px;letter-spacing:8px;outline:none}.btn{width:100%;height:52px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:850;font-size:16px;margin-top:12px}.btn:disabled{opacity:.45}.eyebrow{color:var(--muted);font-size:13px}.prayer{font-size:38px;font-weight:950;margin:3px 0 12px}.counter{background:var(--soft);border-radius:18px;padding:14px;text-align:center;font-size:30px;font-weight:950;font-variant-numeric:tabular-nums}.times{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.time{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.time span{display:block;color:var(--muted);font-size:12px}.time b{font-size:18px}.actions{margin-top:14px}.done{text-align:center;padding:26px 8px}.done .big{font-size:42px}.done h2{margin:7px 0}.error{background:#fff0f0;color:var(--danger);padding:13px;border-radius:15px;margin-bottom:12px}.hidden{display:none}
</style></head><body><main><div class="logo">🕌</div><div class="title">التفويض</div><div class="sub">أدخل الرقم السري للمتابعة</div><div id="error" class="error hidden"></div><div id="login" class="card"><div class="field"><label>الرقم السري</label><input id="pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code"></div><button id="loginBtn" class="btn">دخول</button></div><div id="state" class="hidden"></div></main><script>
const API="https://masjid-notifier.5jfwpmvt9w.workers.dev";const token=new URLSearchParams(location.search).get('token')||'';let PIN=sessionStorage.getItem('delegate_pin')||'';let NOW=0,START=Date.now(),STATE=null;const AR={fajr:'الفجر',dhuhr:'الظهر',asr:'العصر',maghrib:'المغرب',isha:'العشاء'};
async function post(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'تعذر إكمال الطلب');return j}function sec(h){const [a,b,c=0]=String(h||'0:0').split(':').map(Number);return a*3600+b*60+c}function hms(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function now(){return NOW+Math.floor((Date.now()-START)/1000)}function err(m){error.textContent=m;error.classList.remove('hidden')}
async function enter(){try{error.classList.add('hidden');PIN=pin.value.trim();await post('/api/delegate/login',{token,pin:PIN});sessionStorage.setItem('delegate_pin',PIN);login.classList.add('hidden');state.classList.remove('hidden');await load()}catch(e){err(e.message)}}loginBtn.onclick=enter;pin.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
function render(){if(!STATE)return;if(STATE.finished){state.innerHTML=`<div class="card done"><div class="big">🤍</div><h2>جزاك الله خيرًا</h2><div class="sub">انتهى تفويضك لهذا المسجد</div></div>`;return}const x=STATE.next;const n=now();const a=sec(x.adhan_time),i=sec(x.iqama_time);let label='متبقي على الأذان',target=a;if(n>=a){label='متبقي على الإقامة';target=i}if(n>=i){label='وقت الإقامة';target=i}const evA=(x.events||[]).find(e=>e.type==='adhan'),evI=(x.events||[]).find(e=>e.type==='iqama');const aOpen=n>=a&&n<a+600&&evA&&['pending','alerted'].includes(evA.status);const iOpen=n>=i&&n<i+600&&evI&&['pending','alerted'].includes(evI.status);state.innerHTML=`<div class="card"><div class="eyebrow">صلاتك المفوضة القادمة</div><div class="prayer">${AR[x.prayer]}</div><div class="counter">${label}<br>${hms(target-n)}</div><div class="times"><div class="time"><span>الأذان</span><b>${x.adhan_display}</b></div><div class="time"><span>الإقامة</span><b>${x.iqama_display}</b></div></div><div class="actions">${aOpen?`<button class="btn" onclick="confirmEv('${evA.id}','adhan')">تم الأذان</button>`:''}${iOpen?`<button class="btn" onclick="confirmEv('${evI.id}','iqama')">تمت الإقامة</button>`:''}</div></div>`}
async function load(){try{const j=await post('/api/delegate/state',{token,pin:PIN});STATE=j;if(j.now){NOW=sec(j.now.hms);START=Date.now()}render()}catch(e){err(e.message)}}window.confirmEv=async(id,type)=>{try{await post('/api/delegate/confirm',{token,pin:PIN,event_id:id,type});await load()}catch(e){err(e.message)}};
if(!token)err('رابط التفويض غير صحيح');else if(PIN){pin.value=PIN;login.classList.add('hidden');state.classList.remove('hidden');load()}setInterval(()=>{render()},1000);setInterval(()=>{if(PIN)load()},20000);
</script></body></html>
