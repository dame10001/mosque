<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f5f7f4">
<title>لوحة المؤذن</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#17251d;--muted:#78857d;--line:#e3e9e4;--accent:#1f6b4f;--accent2:#eaf4ef;--danger:#a63d3d;--shadow:0 10px 30px rgba(31,65,46,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(94px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px}.title{font-size:22px;font-weight:850}.sub{font-size:13px;color:var(--muted)}.status{font-size:12px;background:var(--accent2);color:var(--accent);padding:7px 10px;border-radius:999px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}.hero{background:linear-gradient(145deg,#fff,#edf5f0)}.eyebrow{color:var(--muted);font-size:13px}.heroName{font-size:34px;font-weight:900;margin:4px 0}.count{font-variant-numeric:tabular-nums;font-size:28px;font-weight:900;letter-spacing:.5px;margin-top:10px}.times{display:flex;gap:10px;margin-top:14px}.pill{flex:1;background:#f7f9f7;border:1px solid var(--line);border-radius:16px;padding:11px;text-align:center}.pill b{display:block;font-size:16px;margin-top:3px}.sectionTitle{font-size:16px;font-weight:850;margin:4px 0 12px}.prayer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.prayer:last-child{border-bottom:0}.prayerName{font-weight:850}.mini{font-size:12px;color:var(--muted);margin-top:3px}.timeStrong{font-weight:850;font-variant-numeric:tabular-nums}.editBtn,.ghost,.primary,.danger{min-height:46px;border-radius:14px;border:0;padding:0 15px;font-weight:800}.editBtn,.ghost{background:#f4f7f5;color:var(--ink);border:1px solid var(--line)}.primary{background:var(--accent);color:white;width:100%}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f3d4d4}.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(590px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid var(--line);padding:6px;border-radius:20px;box-shadow:0 14px 38px rgba(22,48,34,.14)}.tab{height:52px;border:0;border-radius:15px;background:transparent;color:var(--muted);font-weight:800}.tab.active{background:var(--accent2);color:var(--accent)}.page{display:none}.page.active{display:block}.modalWrap{position:fixed;z-index:100;inset:0;background:rgba(12,26,18,.38);display:none;align-items:flex-end;justify-content:center;padding:16px}.modalWrap.show{display:flex}.modal{width:min(560px,100%);background:white;border-radius:24px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 24px 60px rgba(0,0,0,.22);animation:up .18s ease}.modal h3{margin:0 0 6px;font-size:20px}.modal p{margin:0 0 16px;color:var(--muted);line-height:1.6}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;background:#fff;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.chip.on{background:var(--accent2);border-color:#b8d8c9;color:var(--accent)}.selection{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.selection:last-child{border:0}.empty{text-align:center;color:var(--muted);padding:24px 8px}.toast{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#173d2d;color:white;padding:11px 16px;border-radius:999px;font-size:13px;display:none}.toast.show{display:block}.pin{font-size:34px;font-weight:950;letter-spacing:8px;text-align:center;background:#f5f8f6;border:1px dashed #b7cabc;border-radius:18px;padding:14px;margin:14px 0}.delegation{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.delegation:last-child{border:0}.error{background:#fff0f0;color:#8c3131;border:1px solid #f3d6d6;border-radius:16px;padding:13px;margin-bottom:12px}.hidden{display:none}@keyframes up{from{transform:translateY(12px);opacity:.7}to{transform:none;opacity:1}}@media(min-width:700px){.modalWrap{align-items:center}.modal{border-radius:26px}.app{padding-top:22px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div id="mosque" class="title">جامع الحي</div><div class="sub">لوحة المؤذن</div></div><div class="status">متصل</div></div>
  <div id="error" class="error hidden"></div>

  <section id="pageToday" class="page active">
    <div id="hero" class="card hero"><div class="eyebrow">الصلاة القادمة</div><div class="heroName">—</div><div class="count">--:--:--</div><div class="times"><div class="pill">الأذان<b>—</b></div><div class="pill">الإقامة<b>—</b></div></div></div>
    <div class="card"><div class="sectionTitle">صلوات اليوم</div><div id="todayList"></div></div>
  </section>

  <section id="pageTimes" class="page">
    <div class="card"><div class="sectionTitle">تعديل الأذان والإقامة</div><div class="sub" style="margin-bottom:10px">التعديل بالدقائق ويُحفظ للصلاة المختارة.</div><div id="settingsList"></div></div>
  </section>

  <section id="pageDelegate" class="page">
    <div class="card">
      <div class="sectionTitle">إنشاء تفويض</div>
      <div class="field"><label>اليوم</label><input id="delegDate" type="date"></div>
      <div class="field"><label>الصلوات</label><div id="chips" class="chips"></div></div>
      <button id="addSelection" class="ghost" style="width:100%;margin-top:8px">إضافة للاختيار</button>
      <div id="selectedWrap" style="margin-top:10px"></div>
      <button id="createDelegation" class="primary" style="margin-top:14px">إنشاء التفويض</button>
    </div>
    <div class="card"><div class="sectionTitle">التفويضات</div><div id="delegations"></div></div>
  </section>
</div>

<nav class="tabs"><button class="tab active" data-page="Today">اليوم</button><button class="tab" data-page="Times">الأوقات</button><button class="tab" data-page="Delegate">التفويض</button></nav>

<div id="editModal" class="modalWrap"><div class="modal"><h3 id="editTitle">تعديل الصلاة</h3><p>غيّر ما تحتاجه فقط.</p><div class="field"><label>تأخير الأذان بالدقائق</label><input id="adhanOffset" type="number" inputmode="numeric" min="-180" max="180"></div><div class="field"><label>الإقامة بعد الأذان بالدقائق</label><input id="iqamaDelay" type="number" inputmode="numeric" min="0" max="180"></div><div class="row"><button class="ghost" onclick="closeModal('editModal')">إلغاء</button><button id="savePrayer" class="primary">حفظ</button></div></div></div>

<div id="doneModal" class="modalWrap"><div class="modal"><h3>تم إنشاء التفويض ✓</h3><p>تم نسخ الرابط. أرسله للمؤذن المفوّض.</p><div id="pinBox" class="pin">0000</div><button id="copyPin" class="ghost" style="width:100%">نسخ الرقم السري</button><button class="primary" style="margin-top:9px" onclick="closeModal('doneModal')">تم</button></div></div>
<div id="toast" class="toast">تم</div>

<script>
const API_BASE="https://masjid-notifier.5jfwpmvt9w.workers.dev";
const DELEGATE_BASE="https://dame10001.github.io/mosque/delegate.html";
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#f5f7f4');tg.setBackgroundColor('#f5f7f4')}catch{}}
const initData=tg?.initData||"";
const AR={fajr:"الفجر",dhuhr:"الظهر",asr:"العصر",maghrib:"المغرب",isha:"العشاء"};
let DATA=null, selected=[], selectedPrayers=new Set(), editPrayer=null, clockBase=0, clockStarted=Date.now(), lastPin="";
async function req(path,opt={}){const r=await fetch(API_BASE+path,{...opt,headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"تعذر إكمال الطلب");return j}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function hms(sec){sec=Math.max(0,Math.floor(sec));return [Math.floor(sec/3600),Math.floor((sec%3600)/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':')}
function sec(hm){const [h,m,s=0]=String(hm||'0:0').split(':').map(Number);return h*3600+m*60+s}
function nowSec(){return clockBase+Math.floor((Date.now()-clockStarted)/1000)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function openModal(id){document.getElementById(id).classList.add('show')} function closeModal(id){document.getElementById(id).classList.remove('show')}
function todayISO(){return DATA?.now?.date||new Date().toISOString().slice(0,10)}
function renderHero(){if(!DATA)return;const n=nowSec();let candidates=[];for(const p of DATA.prayers){let a=sec(p.adhan_time),i=sec(p.iqama_time);if(a>n)candidates.push({type:'أذان',p,time:a,display:p.adhan_display});else if(i>n)candidates.push({type:'إقامة',p,time:i,display:p.iqama_display})}let x=candidates.sort((a,b)=>a.time-b.time)[0];if(!x){hero.innerHTML='<div class="eyebrow">انتهت صلوات اليوم</div><div class="heroName">غدًا بإذن الله</div>';return}hero.innerHTML=`<div class="eyebrow">${x.type} الصلاة القادمة</div><div class="heroName">${AR[x.p.prayer]}</div><div class="count" data-target="${x.time}">${hms(x.time-n)}</div><div class="times"><div class="pill">الأذان<b>${x.p.adhan_display}</b></div><div class="pill">الإقامة<b>${x.p.iqama_display}</b></div></div>`}
function renderToday(){todayList.innerHTML=DATA.prayers.map(p=>`<div class="prayer"><div><div class="prayerName">${AR[p.prayer]}</div><div class="mini">الإقامة ${p.iqama_display}</div></div><div class="timeStrong">${p.adhan_display}</div></div>`).join('')}
function renderSettings(){settingsList.innerHTML=DATA.prayers.map(p=>`<div class="prayer"><div><div class="prayerName">${AR[p.prayer]}</div><div class="mini">تأخير الأذان ${Number(p.adhan_offset)>=0?'+':''}${p.adhan_offset} د • الإقامة ${p.iqama_delay} د</div></div><button class="editBtn" onclick="edit('${p.prayer}')">تعديل</button></div>`).join('')}
function edit(prayer){const p=DATA.prayers.find(x=>x.prayer===prayer);editPrayer=prayer;editTitle.textContent=`تعديل ${AR[prayer]}`;adhanOffset.value=p.adhan_offset;iqamaDelay.value=p.iqama_delay;openModal('editModal')}
savePrayer.onclick=async()=>{try{savePrayer.disabled=true;const j=await req('/api/mini/settings',{method:'POST',body:JSON.stringify({prayer:editPrayer,adhan_offset:Number(adhanOffset.value),iqama_delay:Number(iqamaDelay.value)})});DATA.prayers=j.prayers;renderToday();renderSettings();renderHero();closeModal('editModal');toast('تم الحفظ')}catch(e){toast(e.message)}finally{savePrayer.disabled=false}};
function renderChips(){chips.innerHTML=Object.entries(AR).map(([k,v])=>`<button class="chip ${selectedPrayers.has(k)?'on':''}" data-p="${k}">${v}</button>`).join('');chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const p=b.dataset.p;selectedPrayers.has(p)?selectedPrayers.delete(p):selectedPrayers.add(p);renderChips()})}
function renderSelected(){if(!selected.length){selectedWrap.innerHTML='';return}selectedWrap.innerHTML=selected.map((x,i)=>`<div class="selection"><div><b>${x.date}</b><div class="mini">${AR[x.prayer]}</div></div><button class="ghost" onclick="removeSelected(${i})">حذف</button></div>`).join('')}
window.removeSelected=i=>{selected.splice(i,1);renderSelected()};
addSelection.onclick=()=>{const d=delegDate.value;if(!d||!selectedPrayers.size)return toast('اختر اليوم والصلاة');for(const p of selectedPrayers){if(!selected.some(x=>x.date===d&&x.prayer===p))selected.push({date:d,prayer:p})}selectedPrayers.clear();renderChips();renderSelected()};
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
createDelegation.onclick=async()=>{try{if(!selected.length)return toast('أضف صلاة واحدة على الأقل');createDelegation.disabled=true;const j=await req('/api/mini/delegations',{method:'POST',body:JSON.stringify({items:selected})});const link=`${DELEGATE_BASE}?token=${encodeURIComponent(j.token)}`;await copyText(link);lastPin=j.pin;pinBox.textContent=j.pin;selected=[];renderSelected();await loadDelegations();openModal('doneModal');tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message)}finally{createDelegation.disabled=false}};
copyPin.onclick=async()=>{await copyText(lastPin);toast('تم نسخ الرقم')};
async function loadDelegations(){try{const j=await req('/api/mini/delegations');const rows=j.delegations||[];delegations.innerHTML=rows.length?rows.map(d=>`<div class="delegation"><div><b>${d.status==='active'?'فعال':'منتهي'}</b><div class="mini">${d.items.length} صلاة • حتى ${esc(d.expires_at)}</div></div>${d.status==='active'?`<button class="danger" onclick="revoke(${d.id})">إلغاء</button>`:''}</div>`).join(''):'<div class="empty">لا توجد تفويضات</div>'}catch(e){delegations.innerHTML='<div class="empty">تعذر تحميل التفويضات</div>'}}
window.revoke=async id=>{try{await req('/api/mini/delegations/revoke',{method:'POST',body:JSON.stringify({id})});toast('تم إلغاء التفويض');loadDelegations()}catch(e){toast(e.message)}};
async function load(){try{const j=await req('/api/mini/settings');DATA=j;mosque.textContent=j.mosque_name||'جامع الحي';clockBase=sec(j.now.hms);clockStarted=Date.now();renderToday();renderSettings();renderHero();delegDate.min=j.now.date;delegDate.value=j.now.date;renderChips();await loadDelegations()}catch(e){error.textContent=e.message;error.classList.remove('hidden')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('page'+b.dataset.page).classList.add('active');if(b.dataset.page==='Delegate')loadDelegations()});
setInterval(()=>{if(DATA)renderHero()},1000);
if(!initData){error.textContent='افتح لوحة المؤذن من داخل تيليجرام.';error.classList.remove('hidden')}else load();
</script>
</body></html>
