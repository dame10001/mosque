<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://mosque-api.5jfwpmvt9w.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#0b6b4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">

<body>
<header class="topbar safe-top">
  <div class="topbar-brand"><div class="mini-logo">⏱</div><div><strong class="app-title">إعدادات الإقامة</strong><div class="muted small">بعد الأذان</div></div></div>
</header>
<main class="page iqama-settings-page">
  <section class="admin-hero compact-hero"><span class="eyebrow">خاص بالمؤذن</span><h1>وقت الإقامة بعد الأذان</h1><p>حدد الفاصل بالدقائق لكل صلاة. هذا الوقت للتذكير والحساب فقط، ولا يمنع تأكيد الإقامة يدويًا.</p></section>
  <section class="card iqama-card" id="iqamaSettingsCard">
    <form id="iqamaForm" class="iqama-list">
      <label class="iqama-row"><span class="prayer-dot dawn">ف</span><span class="iqama-name"><strong>الفجر</strong><small>بعد الأذان</small></span><span class="number-control"><button type="button" data-step="-5" data-target="FAJR">−</button><input id="iqama_FAJR" data-prayer="FAJR" type="number" inputmode="numeric" min="0" max="120" step="5" value="30"><button type="button" data-step="5" data-target="FAJR">+</button></span></label>
      <label class="iqama-row"><span class="prayer-dot noon">ظ</span><span class="iqama-name"><strong>الظهر</strong><small>بعد الأذان</small></span><span class="number-control"><button type="button" data-step="-5" data-target="DHUHR">−</button><input id="iqama_DHUHR" data-prayer="DHUHR" type="number" inputmode="numeric" min="0" max="120" step="5" value="20"><button type="button" data-step="5" data-target="DHUHR">+</button></span></label>
      <label class="iqama-row"><span class="prayer-dot asr">ع</span><span class="iqama-name"><strong>العصر</strong><small>بعد الأذان</small></span><span class="number-control"><button type="button" data-step="-5" data-target="ASR">−</button><input id="iqama_ASR" data-prayer="ASR" type="number" inputmode="numeric" min="0" max="120" step="5" value="20"><button type="button" data-step="5" data-target="ASR">+</button></span></label>
      <label class="iqama-row"><span class="prayer-dot sunset">م</span><span class="iqama-name"><strong>المغرب</strong><small>بعد الأذان</small></span><span class="number-control"><button type="button" data-step="-5" data-target="MAGHRIB">−</button><input id="iqama_MAGHRIB" data-prayer="MAGHRIB" type="number" inputmode="numeric" min="0" max="120" step="5" value="15"><button type="button" data-step="5" data-target="MAGHRIB">+</button></span></label>
      <label class="iqama-row"><span class="prayer-dot night">ع</span><span class="iqama-name"><strong>العشاء</strong><small>بعد الأذان</small></span><span class="number-control"><button type="button" data-step="-5" data-target="ISHA">−</button><input id="iqama_ISHA" data-prayer="ISHA" type="number" inputmode="numeric" min="0" max="120" step="5" value="20"><button type="button" data-step="5" data-target="ISHA">+</button></span></label>
      <button class="btn btn-primary btn-xl" type="submit" id="saveIqamaBtn">حفظ إعدادات الإقامة</button>
      <div id="iqamaStatusBox" class="status-box hidden" role="status" aria-live="polite"></div>
    </form>
  </section>
  <section class="account-logout-zone" aria-label="الحساب">
    <button class="btn account-logout-btn" id="logoutBtn" type="button">تسجيل الخروج من الحساب</button>
  </section>
  <div id="globalStatus" class="status-box hidden"></div>
</main>

</body>
</html>
